# Alembic 配置文件
[alembic]
# 迁移脚本目录
script_location = alembic
# 数据库 URL 占位，实际由 env.py 从 settings 读取
sqlalchemy.url = sqlite+aiosqlite:///./archsuite.db
# 模板文件
template = generic
# 时区
timezone = Asia/Shanghai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
