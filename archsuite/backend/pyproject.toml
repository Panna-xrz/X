[project]
name = "archsuite-backend"
version = "0.1.0"
description = "建筑设计项目 AI 管理平台 - 后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
    "httpx",
    "openai",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Ruff 配置：代码检查与风格
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

# Black 配置：代码格式化
[tool.black]
line-length = 100
target-version = ["py310"]

# Mypy 配置：静态类型检查
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
